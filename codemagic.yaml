workflows:
  ios-native-unsigned:
    name: KcalTrack iOS (unsigned test build)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 26.5
    scripts:
      - name: Validate and build KcalTrack without code signing
        script: |
          set -euo pipefail
          xcodebuild -list -project "$CM_BUILD_DIR/KcalTrackNative.xcodeproj"
          xcodebuild build \
            -project "$CM_BUILD_DIR/KcalTrackNative.xcodeproj" \
            -scheme "KcalTrackNative" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
    artifacts:
      - $CM_BUILD_DIR/build/Build/Products/Release-iphoneos/*.app
